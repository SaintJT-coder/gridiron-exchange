name: Publish app and settle market
on:
  push:
    branches: [main]
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
    inputs:
      historical_backfill:
        description: 'Explicitly repair missing historical projections (records retain historical provenance)'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: market-data
          path: .market-store
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Update shared market
        env:
          ALLOW_BACKFILL: ${{ inputs.historical_backfill }}
        run: |
          args=()
          if [ "$ALLOW_BACKFILL" = "true" ]; then args+=(--allow-historical-backfill); fi
          node scripts/update-market.mjs --state .market-store/market.json --output public/market.json "${args[@]}"
      - name: Preserve append-only market state
        run: |
          cp public/market.json .market-store/market.json
          cd .market-store
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market.json
          if ! git diff --cached --quiet; then git commit -m 'Update shared market ledger'; git push; fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
